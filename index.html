<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phil's Phavoriten</title>
  
  <!-- Custom Playful & Google Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --outer-bg: #eae8e1;
      --page-bg: #f4f1ea;
      --card-bg: #e8e3d8;
      --image-bg: #ffffff;
      --purple-primary: #6c5ce7;
      --purple-dark: #5849c4;
      --text-dark: #1e1e1e;
      --text-muted: #787570;
      --btn-bg: #222222;
      --btn-hover: #000000;
      --bought-badge: #10b981;
      --radius-large: 28px;
      --radius-card: 22px;
      --radius-img: 16px;
      --radius-btn: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--outer-bg);
      font-family: 'Google Sans', -apple-system, sans-serif;
      color: var(--text-dark);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      background-color: var(--page-bg);
      border-radius: var(--radius-large);
      padding: 3rem 2.5rem 4rem 2.5rem;
      max-width: 1280px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container für Bild + Headline übereinander */
    .title-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    .avatar-img {
      width: 130px; /* Vergrößert */
      height: 130px;
      object-fit: contain;
      display: block;
      margin-bottom: -15px; /* Schließt Lücke zur Pill */
      position: relative;
      z-index: 1;
    }

    /* Bubblige & verspielte Headline */
    .title-pill {
      background-color: var(--purple-primary);
      color: #ffffff;
      font-family: 'Fredoka', cursive;
      font-size: 2.5rem;
      font-weight: 700;
      padding: 0.75rem 2.8rem;
      border-radius: 50px;
      transform: rotate(-3deg);
      display: inline-block;
      box-shadow: 0 10px 0px var(--purple-dark), 0 15px 25px rgba(108, 92, 231, 0.3);
      letter-spacing: 0.8px;
      user-select: none;
      position: relative;
      z-index: 2;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    header p {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
    }

    .card-img-container {
      background-color: var(--image-bg);
      border-radius: var(--radius-img);
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 1.25rem;
      position: relative;
      padding: 10px;
    }

    .card-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .badge-bought {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: var(--bought-badge);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.25;
      margin-bottom: 0.4rem;
      color: var(--text-dark);
      letter-spacing: -0.2px;
    }

    .card-price {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn-shop {
      background-color: var(--btn-bg);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-btn);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.2s ease;
      letter-spacing: 0.5px;
    }

    .btn-shop:hover {
      background-color: var(--btn-hover);
    }

    .btn-shop svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-toggle {
      background: transparent;
      border: 1.5px solid var(--text-muted);
      color: var(--text-dark);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-btn);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Google Sans', -apple-system, sans-serif;
    }

    .btn-toggle:hover {
      border-color: var(--text-dark);
      background-color: rgba(0,0,0,0.03);
    }

    .card.is-bought {
      opacity: 0.65;
    }

    .card.is-bought .badge-bought {
      display: block;
    }

    .card.is-bought .btn-shop {
      pointer-events: none;
      background-color: #999999;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.5rem 1rem;
        border-radius: 20px;
      }
      .avatar-img {
        width: 100px;
        height: 100px;
        margin-bottom: -10px;
      }
      .title-pill {
        font-size: 1.85rem;
        padding: 0.6rem 1.8rem;
      }
      .wishlist-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }
      .card {
        padding: 0.75rem;
      }
      .card-img-container {
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-wrapper">
        <div class="title-pill">Phil's Phavoriten</div>
        <img src="thumbsup.png" alt="Phil" class="avatar-img" />
      </div>
      
      <p>Eine Liste von Dingen, über die ich mich freuen würde.</p>
    </header>

    <main class="wishlist-grid" id="wishlist">
      <p style="text-align: center; grid-column: 1 / -1; font-weight: 700;">Wunschliste wird geladen...</p>
    </main>
  </div>

  <script>
    const BIN_ID = "6a709c5eda38895dfeb3cbc7";
    const API_KEY = "$2a$10$OIcRnf.UfA2mZTYyQLQOfOSS4uea70.yT5U183rae7bm94DLPSFCG";
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT8jbrxPiDJa8e2fCGKGuOP4dhLPFcppY8ridt8X6dhZ6aodXaLZV_Bt7r-30KAOqg4rppfvwv3ak_n/pub?output=csv";

    let gifts = [];
    let boughtItemsMap = {};

    async function loadGiftsFromSheet() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        const csvText = await res.text();
        
        const lines = csvText.trim().split(/\r?\n/);
        const parsedGifts = [];

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
          
          if (cols.length >= 5 && cols[0] && cols[1]) {
            parsedGifts.push({
              id: parseInt(cols[0]),
              title: cols[1],
              price: cols[2],
              image: cols[3],
              url: cols[4]
            });
          }
        }
        return parsedGifts;
      } catch (e) {
        console.error("Fehler beim Laden des Google Sheets:", e);
        return [];
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        boughtItemsMap = data.record && Object.keys(data.record).length > 0 ? data.record : {};
      } catch (e) {
        console.error("Fehler beim Laden des Status:", e);
      }
    }

    async function init() {
      const [fetchedGifts] = await Promise.all([loadGiftsFromSheet(), loadStatus()]);
      gifts = fetchedGifts;
      renderWishlist();
    }

    async function toggleBought(id) {
      boughtItemsMap[id] = !boughtItemsMap[id];
      renderWishlist();

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(boughtItemsMap)
        });
      } catch (e) {
        console.error("Fehler beim Speichern des Status:", e);
      }
    }

    function renderWishlist() {
      const container = document.getElementById('wishlist');
      container.innerHTML = '';

      if (gifts.length === 0) {
        container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; font-weight: 700;">Keine Produkte gefunden.</p>';
        return;
      }

      gifts.forEach(gift => {
        const isBought = !!boughtItemsMap[gift.id];
        const card = document.createElement('div');
        card.className = `card ${isBought ? 'is-bought' : ''}`;
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${gift.image}" alt="${gift.title}" class="card-img" />
            <span class="badge-bought">✓ Gekauft</span>
          </div>
          <div class="card-info">
            <h2 class="card-title">${gift.title}</h2>
            <div class="card-price">${gift.price}</div>
            <div class="card-actions">
              <a href="${gift.url}" target="_blank" rel="noopener noreferrer" class="btn-shop">
                <span>${isBought ? 'Abgehakt' : 'Zum Shop'}</span>
                <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
              </a>
              <button class="btn-toggle" onclick="toggleBought(${gift.id})">
                ${isBought ? 'Freigeben' : 'Als gekauft markieren'}
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
