<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine Geburtstags-Wunschliste</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.1);
    }

    .card-img-wrapper {
      width: 100%;
      height: 200px;
      background-color: #f1f5f9;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-bought {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: var(--success);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-buy {
      background-color: var(--primary);
      color: white;
    }

    .btn-buy:hover {
      background-color: var(--primary-hover);
    }

    .btn-toggle {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-toggle:hover {
      background-color: #e2e8f0;
    }

    .card.is-bought {
      opacity: 0.65;
    }

    .card.is-bought .badge-bought {
      display: block;
    }

    .card.is-bought .btn-buy {
      pointer-events: none;
      background-color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎁 Meine Geburtstags-Wunschliste</h1>
    <p>Hier findet ihr ein paar Dinge, über die ich mich riesig freuen würde!</p>
  </header>

  <main class="wishlist-grid" id="wishlist">
    <p style="text-align: center; grid-column: 1 / -1;">Wunschliste wird geladen...</p>
  </main>

  <script>
    // 1. ZUGANGSDATEN VON JSONBIN.IO
    const BIN_ID = "6a709c5eda38895dfeb3cbc7";
    const API_KEY = "$2a$10$OIcRnf.UfA2mZTYyQLQOfOSS4uea70.yT5U183rae7bm94DLPSFCG";

    // 2. DEINE PRODUKTE (Hier deine Wünsche eintragen)
    const gifts = [
      { 
        id: 1, 
        title: "Fahrrad-Handyhalterung", 
        price: "24,99 €", 
        image: "https://images.unsplash.com/photo-1511994298241-608e28f14fde?w=500&auto=format&fit=crop", 
        url: "https://example.com/item1" 
      },
      { 
        id: 2, 
        title: "Espressokocher Edelstahl", 
        price: "39,90 €", 
        image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop", 
        url: "https://example.com/item2" 
      },
      { 
        id: 3, 
        title: "Gutschein für ein Abendessen", 
        price: "Beliebig", 
        image: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&auto=format&fit=crop", 
        url: "#" 
      }
    ];

    let boughtItemsMap = {};

    // Daten von JSONBin abrufen
    async function loadStatus() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        
        // Fallback, falls der Record leer sein sollte
        boughtItemsMap = data.record && Object.keys(data.record).length > 0 ? data.record : { "0": false };
        renderWishlist();
      } catch (e) {
        console.error("Fehler beim Laden:", e);
      }
    }

    // Status aktualisieren und speichern
    async function toggleBought(id) {
      boughtItemsMap[id] = !boughtItemsMap[id];
      renderWishlist();

      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(boughtItemsMap)
        });
      } catch (e) {
        console.error("Fehler beim Speichern:", e);
      }
    }

    // Wunschliste anzeigen
    function renderWishlist() {
      const container = document.getElementById('wishlist');
      container.innerHTML = '';

      gifts.forEach(gift => {
        const isBought = !!boughtItemsMap[gift.id];
        const card = document.createElement('div');
        card.className = `card ${isBought ? 'is-bought' : ''}`;
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${gift.image}" alt="${gift.title}" class="card-img" />
            <span class="badge-bought">✓ Bereits gekauft</span>
          </div>
          <div class="card-content">
            <h2 class="card-title">${gift.title}</h2>
            <div class="card-price">${gift.price}</div>
            <div class="card-actions">
              <a href="${gift.url}" target="_blank" rel="noopener noreferrer" class="btn btn-buy">
                ${isBought ? 'Bereits geschenkt' : 'Produkt ansehen / kaufen'}
              </a>
              <button class="btn btn-toggle" onclick="toggleBought(${gift.id})">
                ${isBought ? 'Wieder freigeben' : 'Als gekauft abhaken'}
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadStatus();
  </script>
</body>
</html>
